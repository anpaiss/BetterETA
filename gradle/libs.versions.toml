[versions]
agp = "8.3.2"
kotlin = "1.9.23"
karooExt = "1.1.8"
coreKtx = "1.13.1"
coroutines = "1.8.1"
appcompat = "1.7.0"
lifecycleRuntime = "2.8.3"

[libraries]
hammerhead-karoo-ext        = { group = "io.hammerhead", name = "karoo-ext",                 version.ref = "karooExt" }
androidx-core-ktx           = { group = "androidx.core", name = "core-ktx",                  version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat", name = "appcompat",             version.ref = "appcompat" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application         = { id = "com.android.application",        version.ref = "agp" }
jetbrains-kotlin-android    = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
