# Every push: unit tests + debug APK as a downloadable artifact.
# Tag v*: signed release APK + Karoo extension manifest attached to a GitHub
# release. The Karoo reads .../releases/latest/download/manifest.json (see
# MANIFEST_URL in AndroidManifest.xml) to offer installs and updates.
#
# A release also gets a signed build provenance (anyone can check that the APK
# was built here from this tag) and, when the VT_API_KEY secret exists, a
# VirusTotal scan whose report is linked in the release notes.
#
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD for
# signing; GPR_TOKEN (a PAT with read:packages) only if GITHUB_TOKEN cannot
# read the hammerheadnav/karoo-ext package.
name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: read
  id-token: write       # build provenance attestation of the release APK
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # settings.gradle.kts reads these for the karoo-ext GitHub Packages repo.
      USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
      # app/build.gradle.kts turns these into versionName / versionCode.
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper jar is not tracked, so use a provisioned Gradle of the
      # version pinned in gradle/wrapper/gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests and debug APK
        run: gradle :eta-core:testDebugUnitTest :app:testDebugUnitTest :boschrange:testDebugUnitTest :app:assembleDebug :boschrange:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            eta-core/build/test-results/testDebugUnitTest/
            boschrange/build/test-results/testDebugUnitTest/

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: boschrange-debug
          path: boschrange/build/outputs/apk/debug/boschrange-debug.apk

      - name: Check signing secrets
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing: a release must be signed"
            exit 1
          fi

      - name: Signed release APK and manifest
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      # The download counter and releases/latest/download need one fixed asset name
      - name: Fixed asset name for releases/latest/download
        if: github.ref_type == 'tag'
        run: cp app/build/outputs/apk/release/app-release.apk BetterETA.apk

      - name: Build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: BetterETA.apk

      # Uploads the APK to VirusTotal and links its report; skipped without the VT_API_KEY secret.
      - name: VirusTotal
        if: github.ref_type == 'tag'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          sha=$(sha256sum BetterETA.apk | cut -d' ' -f1)
          {
            echo "### Is this APK safe?"
            echo
            echo "- SHA-256: \`$sha\`"
            if [ -n "$VT_API_KEY" ]; then
              curl -sf --request POST --url https://www.virustotal.com/api/v3/files \
                --header "x-apikey: $VT_API_KEY" --form file=@BetterETA.apk > /dev/null \
                && echo "- VirusTotal report: https://www.virustotal.com/gui/file/$sha"
            fi
            echo "- Built by GitHub Actions from this tag, with a signed provenance. Check it with:"
            echo "  \`gh attestation verify BetterETA.apk -R anpaiss/BetterETA\`"
          } > release-body.md
          cat release-body.md

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "BetterETA.apk,app/manifest.json"
          bodyFile: release-body.md
          generateReleaseNotes: true
